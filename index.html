<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gessé Soares</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center}main{padding:2rem;max-width:640px}h1{font-size:2.5rem;margin:0 0 1rem}a.cv{display:inline-block;margin-top:1.5rem;padding:.8rem 1.6rem;border-radius:999px;background:#38bdf8;color:#0f172a;font-weight:700;text-decoration:none}.lang{position:fixed;top:1rem;right:1rem;display:flex;gap:.4rem}.lang button{background:transparent;color:#fff;border:1px solid #fff6;border-radius:999px;padding:.3rem .8rem;cursor:pointer}.lang button.on{background:#fff;color:#0f172a}</style></head>
<body><div class="lang" translate="no"><button data-l="pt">PT</button><button data-l="en">EN</button></div>
<main><h1 id="t"></h1><a class="cv" id="cv"></a></main>
<script>
const T={pt:{t:"Olá, eu sou o Gessé 👋",b:"Baixar currículo",f:"cv.pdf",n:"Curriculo-Gesse-Soares-PT.pdf"},en:{t:"Hi, I'm Gessé 👋",b:"Download resume",f:"cv-en.pdf",n:"Resume-Gesse-Soares-EN.pdf"}};
const h=document.documentElement;let manual=null,busy=false;
const det=()=>manual||(/^en/i.test(h.lang)?"en":/^pt/i.test(h.lang)?"pt":(/^pt/i.test(navigator.language)?"pt":"en"));
function apply(){const l=det(),d=T[l],a=document.getElementById("cv");a.href="https://gessemacedo.github.io/assets/"+d.f;a.download=d.n;
if(!h.classList.contains("translated-ltr")){document.getElementById("t").textContent=d.t;a.textContent=d.b;busy=true;h.lang=l==="pt"?"pt-BR":"en";busy=false}
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l))}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{manual=b.dataset.l;apply()});
new MutationObserver(()=>{if(!busy){manual=null;apply()}}).observe(h,{attributes:true,attributeFilter:["lang","class"]});
h.lang="";apply();
</script></body></html>
